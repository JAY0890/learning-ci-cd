name: go CI 

on:
  push:
   branches:
   - main

jobs:
  mkit:
   runs-on: ubuntu-latest

   steps:
     - name: checkout
       uses: actions/checkout@v5

     - name: install go 
       uses: actions/setup-go@v5
       with :
        go-version: '1.24'
      
     - name: make binary 
       run: go build -o myapp . 

